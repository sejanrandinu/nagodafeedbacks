<!DOCTYPE html>
<html lang="si">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>අපි ගැන අපට කියන්න | Tell Us About Us</title>
    <meta name="description" content="Submit your feedback and complaints easily.">
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/4/4b/Emblem_of_Sri_Lanka.svg"
        type="image/svg+xml">
</head>

<body>
    <div class="background-shape shape-1"></div>
    <div class="background-shape shape-2"></div>
    <div class="background-shape shape-3"></div>

    <div class="container">
        <header class="header">
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="si">සිංහල</button>
                <button class="lang-btn" data-lang="ta">தமிழ்</button>
                <button class="lang-btn" data-lang="en">English</button>
            </div>
            <h2 id="deptTitleText" class="dept-title">නාගොඩ ප්‍රාදේශීය ලේකම් කාර්යාලය</h2>
            <h1 id="titleText">අපි ගැන අපිට කියන්න</h1>
        </header>

        <form id="reviewForm" class="review-form">

            <div class="rating-section">
                <div class="rating-options">
                    <label class="rating-option" for="rating-very-happy">
                        <input type="radio" name="rating" id="rating-very-happy" value="very-happy" required>
                        <div class="emoji-container">
                            <span class="emoji">🤩</span>
                        </div>
                        <span class="rating-label" id="ratingVeryHappyText">ඉතා හොඳයි</span>
                    </label>

                    <label class="rating-option" for="rating-happy">
                        <input type="radio" name="rating" id="rating-happy" value="happy">
                        <div class="emoji-container">
                            <span class="emoji">😊</span>
                        </div>
                        <span class="rating-label" id="ratingHappyText">හොඳයි</span>
                    </label>

                    <label class="rating-option" for="rating-bad">
                        <input type="radio" name="rating" id="rating-bad" value="bad">
                        <div class="emoji-container">
                            <span class="emoji">😞</span>
                        </div>
                        <span class="rating-label" id="ratingBadText">අසතුටුදායකයි</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="userName" id="nameLabel">නම (කැමති නම් පමණක්)</label>
                <input type="text" id="userName" name="userName" placeholder="ඔබේ නම ඇතුළත් කරන්න">
            </div>

            <div class="form-group">
                <label for="userAddress" id="addressLabel">ලිපිනය (කැමති නම් පමණක්)</label>
                <input type="text" id="userAddress" name="userAddress" placeholder="ඔබේ ලිපිනය ඇතුළත් කරන්න">
            </div>

            <div class="form-group">
                <label for="userPhone" id="phoneLabel">දුරකථන අංකය (කැමති නම් පමණක්)</label>
                <input type="tel" id="userPhone" name="userPhone" placeholder="ඔබේ දුරකථන අංකය ඇතුළත් කරන්න">
            </div>

            <div class="form-group">
                <label for="userPurposeSelect" id="purposeLabel">පැමිණි අංශය</label>
                <select id="userPurposeSelect" name="userPurposeSelect" required>
                    <option value="" id="purposeOptionDefault">-- කරුණාකර තෝරන්න --</option>
                    <option value="ds" id="purposeOptionDS">ප්‍රාදේශීය ලේකම් හමුවීමට</option>
                    <option value="ads" id="purposeOptionADS">සහකාර ප්‍රාදේශීය ලේකම් හමුවීමට</option>
                    <option value="est" id="purposeOptionEst">ආයතන අංශය</option>
                    <option value="land" id="purposeOptionLand">ඉඩම් අංශය</option>
                    <option value="nic" id="purposeOptionNIC">හැඳුනුම්පත් අංශය</option>
                    <option value="reg" id="purposeOptionReg">රෙජිස්ට්‍රාර් අංශය</option>
                    <option value="motor" id="purposeOptionMotor">මෝටර් රථ අංශය</option>
                    <option value="shroff" id="purposeOptionShroff">සරප් අංශය</option>
                    <option value="accounts" id="purposeOptionAccounts">ගිණුම් අංශය</option>
                    <option value="dev" id="purposeOptionDev">සංවර්ධන අංශය</option>
                    <option value="social" id="purposeOptionSocial">සමාජ සේවා අංශය</option>
                    <option value="samurdhi" id="purposeOptionSamurdhi">සමෘද්ධි අංශය</option>
                    <option value="vidatha" id="purposeOptionVidatha">විදාතා සම්පත් මධ්‍යස්ථානය</option>
                    <option value="gn" id="purposeOptionGN">ග්‍රාම නිලධාරී අංශය</option>
                    <option value="other" id="purposeOptionOther">වෙනත්</option>
                </select>
            </div>

            <div class="form-group hidden" id="otherPurposeGroup">
                <input type="text" id="userPurposeOther" name="userPurposeOther"
                    placeholder="ඔබ පැමිණි අංශය ඇතුළත් කරන්න">
            </div>

            <div class="form-group">
                <label for="userMessage" id="messageLabel">පණිවිඩය (කැමති නම් පමණක්)</label>
                <textarea id="userMessage" name="userMessage" rows="4" placeholder="ඔබේ අදහස මෙහි ලියන්න..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">යොමු කරන්න</button>
        </form>

        <div id="successMessage" class="success-message hidden">
            <div class="success-icon">✨</div>
            <h2 id="thankYouText">ඔබේ ප්‍රතිචාරයට ස්තුතියි!</h2>
            <button id="newReviewBtn" class="new-review-btn">ගොස් තවත් එකක්</button>
        </div>

        <footer class="footer">
            © Copyright 2026. All rights reserved. Designed and developed by B.L.Sejan Randinu ©
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
